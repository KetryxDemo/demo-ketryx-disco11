name: Verification and Ketryx reporting

# Version-pinned on purpose: the release version is an explicit input rather than
# something inferred from a tag. push.branches never matches tag pushes, which is
# how versions end up sitting in Draft with zero executions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Ketryx version to report against
        required: true
        default: 1.0.0
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run acceptance suite
        run: npm test
        continue-on-error: true

      - name: Strip trace tags from report
        # @tests tags belong in the .feature SOURCE - that is what builds the
        # Test Case trace at repo-scan time. Leaving them in the RUNTIME report
        # makes the Build API also create a bare AT linked straight to the
        # requirement, so the matrix shows every scenario twice.
        run: |
          node -e "
            const fs = require('fs');
            const p = 'reports/cucumber.json';
            const r = JSON.parse(fs.readFileSync(p, 'utf8'));
            for (const feat of r) {
              for (const el of feat.elements || []) {
                el.tags = (el.tags || []).filter(t => !t.name.startsWith('@tests:'));
              }
            }
            fs.writeFileSync(p, JSON.stringify(r));
          "

      - name: Report to Ketryx
        uses: Ketryx/ketryx-github-action@v1
        with:
          # Demo instance, not app.ketryx.com (which is the action's default).
          ketryx-url: https://demo.ketryx.com
          project: ${{ vars.KETRYX_PROJECT }}
          api-key: ${{ secrets.KETRYX_API_KEY }}
          version: ${{ github.event.inputs.version || '1.0.0' }}
          build-name: cp-verification
          test-cucumber-path: reports/cucumber.json
